[package]
name = "velox"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15"
wmi = "0.13"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"