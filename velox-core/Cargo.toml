[package]
name = "velox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.30"
wmi = "0.13"
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
